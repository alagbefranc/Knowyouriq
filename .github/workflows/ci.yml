name: Pipeline

# push -> unit -> integration -> e2e -> perf -> ship
# Each stage runs only if the one before it passed. Ship runs on main only.

on:
  push:
  pull_request:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit

  integration:
    name: Integration
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: End to end
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Build for Cloudflare Workers
        run: npm run cf:build
      - name: End-to-end tests on the Workers runtime with a local D1 database
        run: |
          npm run db:migrate:local
          npx wrangler dev --port 8787 --var PAYMENTS_MODE:mock > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8787 && break; sleep 1; done
          BASE_URL=http://localhost:8787 npm run test:e2e
        env:
          CI: "true"
      - name: Keep the report if a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 7

  perf:
    name: Performance
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Performance bars
        run: npm run test:perf

  ship:
    name: Ship
    needs: perf
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Check deploy settings
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ship skipped. Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
          elif grep -q REPLACE_WITH_D1_DATABASE_ID wrangler.jsonc; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ship skipped. Create the D1 database (npm run db:create) and put its id in wrangler.jsonc."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.ready.outputs.ok == 'true'
      - name: Apply database migrations
        if: steps.ready.outputs.ok == 'true'
        run: npm run db:migrate
      - name: Build and deploy to Cloudflare Workers
        if: steps.ready.outputs.ok == 'true'
        run: npm run cf:build && npm run cf:deploy
